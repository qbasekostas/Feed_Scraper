name: Scrape Thread

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          SATU_USER: ${{ secrets.SATU_USER }}
          SATU_PASS: ${{ secrets.SATU_PASS }}
        run: python run_scraper.py

      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # Το --quiet HEAD ελέγχει αν υπάρχουν αλλαγές πριν κάνει commit για να μην βγάζει error
          git diff-index --quiet HEAD || git commit -m "Update feeds from thread" && git push
